name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      ADMIN_SESSION_SECRET: ci-admin-session-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Smoke production server
        run: |
          npm start -- -H 127.0.0.1 -p 4316 >/tmp/hub985-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl --fail --silent --show-error --location http://127.0.0.1:4316/ >/tmp/hub985-index.html; then
              break
            fi
            sleep 0.25
          done
          test -s /tmp/hub985-index.html
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
